inherit_from: .rubocop_todo.yml

plugins:
  - rubocop-rails
  
AllCops:
  NewCops: enable
  Exclude:
    - bin/**
    - config/**/*
    - vendor/**/*
    - spec/dummy/**/*
    - Rakefile

Style/Documentation:
  Enabled: false

Metrics/ParameterLists:
  Max: 8

Lint/MissingSuper:
  Exclude:
    - app/services/**/*

Metrics/BlockLength:
  Exclude:
    - spec/**/*
    - spree-spl.gemspec
